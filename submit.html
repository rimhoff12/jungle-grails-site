<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit an Event | Jungle Grails</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div class="bg-jungle">
    <div class="leaf leaf-1"></div>
    <div class="leaf leaf-2"></div>
    <div class="leaf leaf-3"></div>
    <div class="sparkle sparkle-1"></div>
    <div class="sparkle sparkle-2"></div>
    <div class="sparkle sparkle-3"></div>
  </div>

  <div id="header"></div>

  <main class="container section">
    <p class="eyebrow">Help improve the database</p>
    <h1 class="page-title">Submit an Event or Correction</h1>
    <p class="page-intro">
      Found a missing show or spotted incorrect details? Send an update for review.
    </p>

    <section class="section">
      <div class="card">
        <form class="form-grid">
          <div>
            <label for="submissionType">Submission Type</label>
            <select id="submissionType" name="submissionType">
              <option>New Event</option>
              <option>Correction</option>
            </select>
          </div>

          <div>
            <label for="showName">Show Name</label>
            <input id="showName" name="showName" type="text" placeholder="Enter show name" />
          </div>

          <div>
            <label for="details">Details</label>
            <textarea id="details" name="details" placeholder="Enter the event details or correction"></textarea>
          </div>

          <div>
            <label for="sourceUrl">Source URL</label>
            <input id="sourceUrl" name="sourceUrl" type="text" placeholder="Paste source link if available" />
          </div>

          <div>
            <label for="submitterName">Your Name</label>
            <input id="submitterName" name="submitterName" type="text" placeholder="Your name" />
          </div>

          <div>
            <label for="submitterEmail">Your Email</label>
            <input id="submitterEmail" name="submitterEmail" type="email" placeholder="your@email.com" />
          </div>

          <div>
            <button class="btn btn-primary" type="submit">Submit for Review</button>
          </div>
        </form>
      </div>
    </section>

    <section class="section">
      <div class="cta-panel">
        <h2 class="section-title">✅ Manual Review First</h2>
        <p class="page-intro">
          Every submission should be reviewed by you before it is added to the live database.
        </p>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="script.js?v=3"></script>
</body>
</html>
